services:
  backend:
    build: .
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/valle_del_sol
      JWT_SECRET: supersecret
      PORT: 8081
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: valle_del_sol
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d valle_del_sol"]
      interval: 5s
      timeout: 5s
      retries: 5
