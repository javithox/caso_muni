spring.application.name=msvc-reporte
server.port=8081

# Base de datos
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:postgresql://localhost:5432/incendio_reporte_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Google Maps API
# IMPORTANTE: Reemplaza esto con tu propia API Key de Google Maps
# Obtén tu API Key en: https://cloud.google.com/maps/billing-and-pricing/pricing?hl=es
google.maps.api.key=${GOOGLE_MAPS_API_KEY:}
